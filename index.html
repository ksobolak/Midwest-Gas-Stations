const map = L.map('map').setView([37.8, -84.5], 7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const groups = { green: [], yellow: [], red: [] };
const colorKey = { '#2ecc71': 'green', '#f1c40f': 'yellow', '#e74c3c': 'red' };

points.forEach(p => {
  const key = colorKey[p.color] || 'red';
  const distLine = (p.dist !== null && p.dist !== undefined)
    ? `<br><span class="dist">${p.dist} mi to nearest Speedway/7-Eleven</span>`
    : '';
  const gmapsLine = p.gmaps
    ? `<br><a class="gmaps-link" href="${p.gmaps}" target="_blank" rel="noopener">Open in Google Maps &rarr;</a>`
    : '';
  const marker = L.circleMarker([p.lat, p.lon], {
    radius: 5,
    fillColor: p.color,
    color: '#333',
    weight: 1,
    fillOpacity: 0.85
  }).bindPopup(`<b>${p.label}</b>Brand: ${p.brand}<br>City: ${p.city || '(unspecified)'}<br>Status: ${p.status}${distLine}${gmapsLine}`);
  groups[key].push(marker);
});

const layerGreen = L.layerGroup(groups.green).addTo(map);
const layerYellow = L.layerGroup(groups.yellow).addTo(map);
const layerRed = L.layerGroup(groups.red).addTo(map);

// 1-mile rings around confirmed-gap cluster centroids
const MILE_IN_METERS = 1609.34;
const ringLayers = rings.map(r => {
  return L.circle([r.lat, r.lon], {
    radius: MILE_IN_METERS,
    color: '#16a34a',
    weight: 1.5,
    fillColor: '#2ecc71',
    fillOpacity: 0.08,
    dashArray: '4,4'
  }).bindPopup(`<b>1-mile ring</b>Cluster #${r.cluster}<br>City: ${r.city || '(unspecified)'}<br>Brands: ${r.brands}<br><span class="dist">${r.dist} mi to nearest Speedway/7-Eleven</span><br><a class="gmaps-link" href="${r.gmaps}" target="_blank" rel="noopener">Open in Google Maps &rarr;</a>`);
});
const layerRings = L.layerGroup(ringLayers).addTo(map);

document.getElementById('chk-green').addEventListener('change', e => {
  if (e.target.checked) map.addLayer(layerGreen); else map.removeLayer(layerGreen);
});
document.getElementById('chk-yellow').addEventListener('change', e => {
  if (e.target.checked) map.addLayer(layerYellow); else map.removeLayer(layerYellow);
});
document.getElementById('chk-red').addEventListener('change', e => {
  if (e.target.checked) map.addLayer(layerRed); else map.removeLayer(layerRed);
});
document.getElementById('chk-rings').addEventListener('change', e => {
  if (e.target.checked) map.addLayer(layerRings); else map.removeLayer(layerRings);
});
</script>
